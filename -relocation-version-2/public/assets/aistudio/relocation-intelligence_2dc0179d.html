.prog{display:flex;gap:6px;padding:12px 5vw;overflow:auto;border-bottom:1px solid var(--bd)}.prog button{background:none;border:0;border-top:3px solid var(--bd);padding:6px 10px 0 0;min-width:96px;text-align:left;font:600 11px Inter;letter-spacing:.1em;color:var(--t2);cursor:pointer}.prog .on{border-color:var(--g);color:var(--tx)}

input,select{font:500 15px Inter;padding:10px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);max-width:100%}
label.q{display:block;font-weight:600;margin:24px 0 8px}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 5vw calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:8}
.disc{display:grid;grid-template-columns:38% 62%;height:calc(100vh - 190px);min-height:560px}.lp{overflow:auto;padding:16px 20px 90px}.mp{position:relative;border-left:1px solid var(--bd)}

.note{position:absolute;left:8px;bottom:8px;font-size:11px;color:var(--t2);background:var(--sf);padding:4px 8px;border:1px solid var(--bd);border-radius:4px;max-width:90%}
.card{border:1px solid var(--bd);border-left:4px solid var(--bd);background:var(--sf);padding:12px;margin:8px 0;border-radius:4px;cursor:pointer}.g0{border-left-color:var(--g)}.g1{border-left-color:var(--y)}.g2{border-left-color:var(--rd)}.card.s{outline:2px solid var(--dg)}

.row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:8px 0}.row input{width:100%;text-align:right}.bk{height:8px;background:var(--bd);border-radius:4px}.bk i{display:block;height:8px;background:var(--g);border-radius:4px}
.m4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:18px 0}.st{display:inline-block;padding:4px 12px;border-radius:20px;color:#fff;font-weight:600;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:8px;text-align:left}.tabs button{margin-right:6px}
@media(max-width:820px){.hero,.wrap{grid-template-columns:1fr}.wrap .side{display:none}.disc{grid-template-columns:1fr;height:auto}.mp{height:46vh;order:-1;border:0}.row{grid-template-columns:90px 1fr 80px}}

.maplibregl-map{position:relative;overflow:hidden}.maplibregl-canvas{position:absolute;left:0;top:0}.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}

.mw{background:var(--dg);color:#fff;padding:5px 9px;font:700 11px Inter,sans-serif;border:2px solid #fff;border-radius:3px;white-space:nowrap}
.mn{display:flex;align-items:center;gap:4px;cursor:pointer}.mn i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:var(--g);box-shadow:0 0 0 1px #0005}.mn b{font:600 11px Inter,sans-serif;background:#fffe;color:#222521;padding:1px 5px;border-radius:3px;border:1px solid var(--bd)}.mn.g1 i{background:var(--y)}.mn.g2 i{background:var(--rd)}.mn.sl i,.mn.on i{box-shadow:0 0 0 3px var(--dg)}.mn.on i{width:20px;height:20px}
.mt{width:11px;height:11px;background:var(--b);border:2px solid #fff;transform:rotate(45deg)}.attr{position:absolute;right:0;bottom:0;background:#fffc;padding:1px 6px;font-size:10px;color:#444;z-index:2}

<script>
const $=s=>document.querySelector(s),R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const BASE={blr:[8000,6000,11000,18000,28000],ncr:[8500,6000,11000,18000,28000]};
const D={blr:{n:'Bengaluru',c:[12.9716,77.5946],hubs:[['Whitefield',12.9698,77.75],['Outer Ring Road',12.9387,77.722],['Electronic City',12.8452,77.6602],['Manyata Tech Park',13.045,77.62],['MG Road',12.9756,77.6068]],
areas:[['Whitefield',12.9698,77.75,1],['Brookefield',12.966,77.716,1],['Marathahalli',12.9569,77.7011,1.1],['Bellandur',12.926,77.6762,1.35],['Sarjapur Road',12.9068,77.697,1.2],['HSR Layout',12.9116,77.6389,1.4],['Koramangala',12.9352,77.6245,1.7],['Indiranagar',12.9784,77.6408,1.75],['Electronic City',12.8452,77.6602,.8],['Hebbal',13.0358,77.597,1],['Yelahanka',13.1007,77.5963,.8],['Mahadevapura',12.991,77.696,1],['Outer Ring Road',12.9387,77.722,1.3],['MG Road',12.9756,77.6068,1.9]]},
ncr:{n:'Delhi NCR',c:[28.57,77.18],hubs:[['Cyber City, Gurugram',28.495,77.089],['Golf Course Road',28.443,77.101],['Udyog Vihar',28.5035,77.079],['Noida Sector 62',28.627,77.365],['Noida Sector 18',28.57,77.322],['Connaught Place',28.6315,77.2167]],
areas:[['Dwarka · Delhi',28.5921,77.046,.9],['Rohini · Delhi',28.7495,77.0565,.8],['Saket · Delhi',28.5245,77.2066,1.5],['Laxmi Nagar · Delhi',28.6304,77.2773,.75],['Janakpuri · Delhi',28.6219,77.0878,1],['Vasant Kunj · Delhi',28.52,77.159,1.6],['Connaught Place · Delhi',28.6315,77.2167,2],['Rajouri Garden · Delhi',28.6492,77.1219,1.1],['Cyber City · Gurugram',28.495,77.089,1.7],['Golf Course Road · Gurugram',28.443,77.101,2],['Sector 56 · Gurugram',28.424,77.106,1.4],['Udyog Vihar · Gurugram',28.5035,77.079,1.2],['Sohna Road · Gurugram',28.41,77.042,1],['Sector 18 · Noida',28.57,77.322,1.3],['Sector 62 · Noida',28.627,77.365,1],['Sector 137 · Noida',28.509,77.4,.8],['Sector 50 · Noida',28.572,77.365,1.1],['Sector 76 · Noida',28.56,77.38,.85]]}};
const P={studio:['Studio','alone',3,.8],b1:['1 BHK','alone',3,1],b2:['2 BHK','alone',4,1],pr:['Private room','share',2,1],sr:['Shared room','share',1,1],s2:['Shared 2 BHK','share',4,.5],pg1:['PG single','pg',0,1],pg2:['PG double','pg',0,.7],pg3:['PG multi-sharing','pg',0,.55]};
const AC={alone:'Living alone',share:'Sharing an apartment',pg:'PG accommodation'},FD={cook:'Mostly cooking',mix:'Mix of cooking & eating out',out:'Mostly eating out'},TR={pub:'Public transport',two:'Two-wheeler',car:'Personal car',cab:'Cabs',combo:'Combination'},LF={bud:'Budget-conscious',mod:'Moderate',comf:'Comfortable'};

let S=Object.assign({},S0),M={z:12,ox:0,oy:0,sel:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('ri2')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('ri2',JSON.stringify(S))}catch(e){}};
const T=()=>S.tm=='target'?S.tgt:0;
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const rent=(c,a,p)=>BASE[c][P[p][2]]*a[3]*P[p][3];
function est(c,a,wp,useOv){const km=hav(a[1],a[2],wp.lat,wp.lng),rd=km*1.4,lm={bud:.85,mod:1,comf:1.25}[S.life],g=P[S.prop][1];
const pub=800+rd*60,cab=rd*616,tr={pub,two:1500+rd*70,car:5000+rd*150,cab,combo:.6*pub+.4*cab}[S.tr],mu={pub:3.2,two:2.4,car:2.8,cab:2.8,combo:3}[S.tr];
const e={rent:rent(c,a,S.prop),food:{cook:6000,mix:8500,out:12000}[S.food]*lm,trans:tr,util:g=='pg'?500:g=='share'?1000:S.prop=='b2'?3000:2000,net:g=='pg'?700:1000,pers:3000*lm,ent:3000*lm,oth:2000};
for(const k in e){e[k]=Math.round(e[k]);if(useOv&&S.ov[k]!=null)e[k]=S.ov[k]}
const tot=Object.values(e).reduce((s,v)=>s+v,0);return{km,min:ROUTES[a[0]+"|"+wp.lat+","+wp.lng]?ROUTES[a[0]+"|"+wp.lat+","+wp.lng].min:null,e,tot,sav:S.sal-tot-S.com}}
function calc(c=S.city,wp=S.wp){const f=S.f,bands=[[0,8e3],[8e3,12e3],[12e3,18e3],[18e3,25e3],[25e3,1e9]];
return D[c].areas.map((a,i)=>{const x=est(c,a,wp),mxk=Math.max(...D[c].areas.map(b=>hav(b[1],b[2],wp.lat,wp.lng)),1),fo=x.sav>=T(),fn=x.sav>=T()-3000,hm=x.min!=null,co=!hm||x.min<=S.maxc,cn=!hm||x.min<=S.maxc+15,g=fo&&co?0:fn&&cn?1:2;
const av=S.sal-S.com-T(),fin=cl((x.sav-T())/(S.sal*.2)+.5,0,1),cm=hm?(co?1:Math.max(0,1-(x.min-S.maxc)/30)):1-x.km/mxk,ac=x.e.rent<=av*.5?1:.5,lf=S.life=='bud'?(a[3]<=1.1?1:.4):S.life=='comf'?(a[3]>=1.2?1:.6):(a[3]>=.8&&a[3]<=1.5?1:.6);
const sc=Math.round(100*(.4*fin+.3*cm+.15*ac+.15*lf)),why=`Rent ${R(x.e.rent)} → est. savings ${R(x.sav)}/mo ${fo?'meets':'falls short of'} your target. ${hm?`Routed commute ${x.min} min ${co?'is within':'exceeds'} your ${S.maxc}-min limit.`:`Commute time unavailable (no routing configured), so proximity is scored by straight-line distance: ${x.km.toFixed(1)} km.`} Score ${sc}/100 = affordability 40% · commute 30% · accommodation 15% · lifestyle 15%.`;
const vis=(!f.r||(x.e.rent>=bands[f.r][0]&&x.e.rent<bands[f.r][1]))&&(!f.c||(RT()?(x.min==null||x.min<=+f.c):x.km<=+f.c))&&(!f.a||(f.a=='w'?fo:f.a=='n'?!fo&&fn:!fn))&&(!f.q||a[0].toLowerCase().includes(f.q));
return{i,a,x,g,sc,why,vis}}).sort((p,q)=>q.sc-p.sc)}
const chosen=()=>{const c=calc();return S.sel.length?c.find(r=>r.i==S.sel[0]):c[0]};
function go(n){S.st=n;S.v='step';S.max=Math.max(S.max||0,n);sv();render();scrollTo(0,0)}
const set=(k,v,r=1)=>{S[k]=v;if(k=='acc')S.prop={alone:'b1',share:'pr',pg:'pg1'}[v];S.ov={};sv();r&&render()};
const land=()=>{const pn=[['blr','Whitefield'],['ncr','Sector 62 · Noida'],['ncr','Cyber City · Gurugram']].map(([c,n])=>{const a=D[c].areas.find(a=>a[0]==n)||D[c].areas.find(a=>a[0].startsWith(n)),x=est(c,a,{lat:a[1],lng:a[2]});return`<div class=pan><p class=k>${D[c].n}</p><h3>${n}</h3><div class=num style="color:${x.sav>=0?'var(--g)':'var(--rd)'}">${R(x.sav)}</div><p class=sm>left each month on ${R(S.sal)}, living at ${n} (${P[S.prop][0]}). Illustrative.</p></div>`}).join('');
return`<div class=hd><b>Relocation Intelligence</b><button class=btn onclick="go(S.max>0?S.st:0)">${S.max>0?'Resume plan':'Plan your move'}</button></div>
<section class=hero><div><p class=k>Know your salary. Understand your city. Make your move.</p><h1>Your next city deserves more than a salary comparison.</h1><p class=lead>Understand what your salary can actually get you. Explore neighbourhoods, estimate living expenses and make smarter relocation decisions.</p><button class=btn onclick=go(0)>Plan your move</button> <button class=btn2 onclick="$('#how').scrollIntoView({behavior:'smooth'})">Explore how it works</button></div>
<svg viewBox="0 0 400 300"><rect x=0 y=215 width=400 height=85 fill="var(--bd)" opacity=".6"/><rect x=0 y=250 width=400 height=14 fill="var(--sf)"/><g fill="#8FA77B"><rect x=24 y=160 width=44 height=55/><rect x=74 y=178 width=38 height=37 fill="#527A43"/><rect x=118 y=150 width=46 height=65/></g><g fill="#fff" opacity=".8">${[0,1,2].map(i=>`<rect x=32 y=${170+i*14} width=8 height=7/><rect x=50 y=${170+i*14} width=8 height=7/><rect x=128 y=${160+i*14} width=8 height=7/><rect x=146 y=${160+i*14} width=8 height=7/>`).join('')}</g><rect x=300 y=105 width=72 height=110 fill="#29452F"/><g fill="#fff" opacity=".7">${[0,1,2,3,4].map(i=>`<rect x=310 y=${116+i*18} width=14 height=8/><rect x=336 y=${116+i*18} width=14 height=8/>`).join('')}</g><path d="M46 257 C130 257 190 232 300 232" fill=none stroke="#E2B84B" stroke-width=3 stroke-dasharray="7 5"/><circle cx=46 cy=257 r=6 fill="#527A43" stroke="#fff" stroke-width=2/><circle cx=300 cy=232 r=6 fill="#D94335" stroke="#fff" stroke-width=2/><text x=30 y=284 font-size=10 fill="var(--t2)">HOME</text><text x=290 y=284 font-size=10 fill="var(--t2)">OFFICE</text><g transform="translate(20,20)"><rect width=170 height=84 fill="var(--sf)" stroke="var(--bd)"/><text x=12 y=20 font-size=10 fill="var(--t2)">MONTHLY EXPENSES</text>${[['Rent',90,'#29452F'],['Food',50,'#527A43'],['Travel',20,'#8FA77B']].map((r,i)=>`<text x=12 y=${42+i*17} font-size=9 fill="var(--tx)">${r[0]}</text><rect x=52 y=${34+i*17} width=${r[1]} height=9 fill="${r[2]}"/>`).join('')}</g><rect x="250" y="40" width="130" height="62" rx="4" fill="var(--sf)" stroke="var(--bd)"/><text x="262" y="62" font-size="10" fill="var(--t2)">TAKE-HOME</text><text x="262" y="90" font-size="22" font-weight="800" fill="var(--tx)">₹50,000</text></svg></section>
<section class=sec><p class=k>The problem</p><h2 style="text-transform:uppercase;font-size:clamp(22px,3vw,34px)">Same salary. Different cities. Different financial realities.</h2><p class=lead>Salary alone doesn’t decide affordability — rent, commute and lifestyle do.</p><div class=g3>${pn}</div></section>
